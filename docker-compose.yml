version: '3.8'\nservices:\n  db:\n    image: "postgres:15"\n    environment:\n      POSTGRES_USER: "user"\n      POSTGRES_PASSWORD: "pass"\n      POSTGRES_DB: "appdb"\n    ports:\n      - "5432:5432"\n    volumes:\n      - "db_data:/var/lib/postgresql/data"\n  auth-service:\n    build: "./auth-service"\n    environment:\n      DATABASE_URL: "postgresql+psycopg2://user:pass@db:5432/appdb"\n      JWT_SECRET: "devsecret"\n    ports:\n      - "8001:8000"\n    depends_on:\n      - "db"\n  property-service:\n    build: "./property-service"\n    environment:\n      DATABASE_URL: "postgresql+psycopg2://user:pass@db:5432/appdb"\n      JWT_SECRET: "devsecret"\n    ports:\n      - "8002:8000"\n    depends_on:\n      - "db"\n  brokerage-service:\n    build: "./brokerage-service"\n    environment:\n      DATABASE_URL: "postgresql+psycopg2://user:pass@db:5432/appdb"\n      JWT_SECRET: "devsecret"\n    ports:\n      - "8003:8000"\n    depends_on:\n      - "db"\n  maintenance-service:\n    build: "./maintenance-service"\n    environment:\n      DATABASE_URL: "postgresql+psycopg2://user:pass@db:5432/appdb"\n      JWT_SECRET: "devsecret"\n    ports:\n      - "8004:8000"\n    depends_on:\n      - "db"\n  support-service:\n    build: "./support-service"\n    environment:\n      DATABASE_URL: "postgresql+psycopg2://user:pass@db:5432/appdb"\n      JWT_SECRET: "devsecret"\n    ports:\n      - "8005:8000"\n    depends_on:\n      - "db"\n  feedback-service:\n    build: "./feedback-service"\n    environment:\n      DATABASE_URL: "postgresql+psycopg2://user:pass@db:5432/appdb"\n      JWT_SECRET: "devsecret"\n    ports:\n      - "8006:8000"\n    depends_on:\n      - "db"\n  inventory-service:\n    build: "./inventory-service"\n    environment:\n      DATABASE_URL: "postgresql+psycopg2://user:pass@db:5432/appdb"\n      JWT_SECRET: "devsecret"\n    ports:\n      - "8007:8000"\n    depends_on:\n      - "db"\nvolumes:\n  db_data:\n